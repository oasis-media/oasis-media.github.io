media:
  input: public
  output: /

components:
  parties:
    type: object
    list: true
    fields:
      - name: id
        label: Group
        type: string
        required: true
      - name: seats
        type: number
        required: true
      - name: data
        label: Status
        type: select
        options:
          values: ["n/a", "gouv", "opp"]
        default: "n/a"
      - name: color
        type: string
        pattern: "^#[0-9a-fA-F]{6}$"
      - name: banner
        label: Other party names
        type: string
        list: true

content:
  - name: carte
    label: Carte
    type: collection
    path: src/pages/carte
    filename: "{fields.code}.md"
    fields:
      - name: layout
        type: string
        hidden: true
        default: "../../layouts/CountriesLayout.astro"
      - name: country
        type: string
        required: true
      - name: code
        label: ISO alpha-2 code
        type: string
        required: true
      - name: date
        type: string
      - name: auteur
        type: string
      - name: U_name
        label: Upper house name
        type: string
      - name: L_name
        label: Lower house name
        type: string
      - name: U
        label: Upper house (parties)
        component: parties
      - name: L
        label: Lower house (parties)
        component: parties
      - name: body
        type: code
        options:
          language: markdown